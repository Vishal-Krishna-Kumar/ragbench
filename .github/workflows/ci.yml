name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy ragbench
      - name: Test
        run: pytest -q
      - name: Benchmark sample dataset
        run: python -m ragbench.cli data/sample

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ragbench:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name rb ragbench:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health
