name: Bug report
description: Something in ragbench returns a wrong result or crashes
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest corpus, query or request that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ragbench version or commit
      placeholder: "0.1.0 or a commit hash"
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12 on Ubuntu 24.04"
