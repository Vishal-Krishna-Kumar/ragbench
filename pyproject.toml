[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "Benchmark BM25, TF-IDF and hybrid (RRF) retrieval for RAG pipelines - library, CLI and FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vishal Krishna Kumar" }]
dependencies = ["numpy>=1.24", "fastapi>=0.110", "pydantic>=2", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ragbench = "ragbench.cli:main"

[tool.setuptools.packages.find]
include = ["ragbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
