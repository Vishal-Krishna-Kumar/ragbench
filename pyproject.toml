[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
dynamic = ["version"]
description = "Benchmark BM25, TF-IDF and hybrid (RRF) retrieval for RAG pipelines - library, CLI and FastAPI service."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Krishna Kumar" }]
keywords = ["rag", "retrieval", "information-retrieval", "bm25", "tf-idf", "benchmark", "evaluation", "ndcg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "fastapi>=0.110", "pydantic>=2", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/Vishal-Krishna-Kumar/ragbench"
Repository = "https://github.com/Vishal-Krishna-Kumar/ragbench"
Issues = "https://github.com/Vishal-Krishna-Kumar/ragbench/issues"
Changelog = "https://github.com/Vishal-Krishna-Kumar/ragbench/blob/main/CHANGELOG.md"

[project.scripts]
ragbench = "ragbench.cli:main"
ragbench-beir = "ragbench.beir:main"

[tool.setuptools.dynamic]
version = { attr = "ragbench.__version__" }

[tool.setuptools.package-data]
ragbench = ["py.typed"]

[tool.setuptools.packages.find]
include = ["ragbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
